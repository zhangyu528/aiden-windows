name: Nightly Tests

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: tests-nightly
  cancel-in-progress: false

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore Aiden.sln

      - name: Run tests (Nightly Scope)
        shell: pwsh
        run: .\tests\Invoke-TestGate.ps1 -Scope Nightly

      - name: Publish .NET test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Nightly .NET Tests
          path: artifacts/test-results/dotnet/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Publish UI test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Nightly UI Tests
          path: artifacts/test-results/ui/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false
