name: Nightly Tests

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: tests-nightly
  cancel-in-progress: false

jobs:
  dotnet-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore Aiden.sln

      - name: Run unit and integration tests
        run: |
          dotnet test tests/Aiden.RuntimeAgent.UnitTests/Aiden.RuntimeAgent.UnitTests.csproj -c Release --no-restore --collect:"XPlat Code Coverage" --logger "trx;LogFileName=runtimeagent-unit.trx" --results-directory artifacts/test-results/dotnet
          dotnet test tests/Aiden.TrayMonitor.UnitTests/Aiden.TrayMonitor.UnitTests.csproj -c Release --no-restore --collect:"XPlat Code Coverage" --logger "trx;LogFileName=traymonitor-unit.trx" --results-directory artifacts/test-results/dotnet
          dotnet test tests/Aiden.IntegrationTests/Aiden.IntegrationTests.csproj -c Release --no-restore --collect:"XPlat Code Coverage" --logger "trx;LogFileName=integration.trx" --results-directory artifacts/test-results/dotnet

      - name: Publish .NET test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Nightly .NET Tests
          path: artifacts/test-results/dotnet/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

  ui-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore Aiden.sln

      - name: Build tray app for UI smoke
        run: |
          dotnet publish Aiden.TrayMonitor/Aiden.TrayMonitor.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o artifacts/ui-test/tray

      - name: Run UI tests
        shell: pwsh
        run: .\scripts\run-ui-tests.ps1 -Configuration Release -NoRestore -AppPath ".\artifacts\ui-test\tray\Aiden.TrayMonitor.exe" -TrxLogFileName "ui-smoke.trx" -ResultsDirectory "artifacts/test-results/ui"

      - name: Publish UI test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Nightly UI Tests
          path: artifacts/test-results/ui/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

  scripts-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run scripts tests
        shell: pwsh
        run: .\scripts\run-script-tests.ps1 -InstallPester

      - name: Upload script test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-pester-test-results
          path: artifacts/test-results/scripts/pester-scripts.xml
          if-no-files-found: ignore

      - name: Summarize script tests
        if: always()
        shell: pwsh
        run: |
          $reportPath = "artifacts/test-results/scripts/pester-scripts.xml"
          if (-not (Test-Path $reportPath)) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Script Tests`nNo Pester report file found at \`$reportPath\`."
            exit 0
          }

          [xml]$report = Get-Content $reportPath -Raw
          $root = $report.'test-results'
          $total = [int]$root.total
          $passed = $total - [int]$root.failures - [int]$root.errors - [int]$root.skipped - [int]$root.'not-run' - [int]$root.inconclusive
          $failed = [int]$root.failures + [int]$root.errors
          $skipped = [int]$root.skipped + [int]$root.'not-run' + [int]$root.inconclusive

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Script Tests"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Total | Passed | Failed | Skipped |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "|---:|---:|---:|---:|"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| $total | $passed | $failed | $skipped |"
