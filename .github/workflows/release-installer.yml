name: Build Release Installer

on:
  release:
    types: [published]

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: release-installer-${{ github.event.release.id }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 8.0.x
  RID: win-x64

jobs:
  build-installer:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw 'Release tag_name is empty'
          }
          if ($tag -match '^v(?<clean>.+)$') {
            $version = $Matches.clean
          } else {
            $version = $tag
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = '0.0.0'
          }
          Write-Output "version=$version" >> $Env:GITHUB_OUTPUT

      - name: Publish Tray Monitor
        run: |
          dotnet publish Aiden.TrayMonitor/Aiden.TrayMonitor.csproj `
            -c Release `
            -r ${{ env.RID }} `
            --self-contained true `
            /p:Version=${{ steps.version.outputs.version }} `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:DebugType=None `
            /p:DebugSymbols=false `
            -o artifacts/stage/tray

      - name: Publish Runtime Agent
        run: |
          dotnet publish Aiden.RuntimeAgent/Aiden.RuntimeAgent.csproj `
            -c Release `
            -r ${{ env.RID }} `
            --self-contained true `
            /p:Version=${{ steps.version.outputs.version }} `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:DebugType=None `
            /p:DebugSymbols=false `
            -o artifacts/stage/agent

      - name: Stage installer payload
        shell: pwsh
        run: |
          & .github/scripts/prepare-package.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Check SignPath readiness
        shell: pwsh
        env:
          SIGNPATH_READY: ${{ vars.SIGNPATH_READY }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_UNSIGNED_ARTIFACT_CFG: ${{ vars.SIGNPATH_UNSIGNED_ARTIFACT_CFG }}
          SIGNPATH_INSTALLER_ARTIFACT_CFG: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CFG }}
        run: |
          if ($env:SIGNPATH_READY -ne "true") {
            throw "SignPath onboarding is not marked ready. Set repository variable SIGNPATH_READY=true after SignPath approval."
          }

          $required = @(
            "SIGNPATH_ORGANIZATION_ID",
            "SIGNPATH_PROJECT_SLUG",
            "SIGNPATH_UNSIGNED_ARTIFACT_CFG",
            "SIGNPATH_INSTALLER_ARTIFACT_CFG"
          )

          $missing = @()
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item -Path "Env:$name").Value)) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            throw "Missing SignPath configuration: $($missing -join ', ')"
          }

      - name: Upload unsigned app binaries for SignPath
        id: upload_unsigned_apps
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-binaries
          path: |
            artifacts/stage/tray/Aiden.TrayMonitor.exe
            artifacts/stage/agent/Aiden.RuntimeAgent.exe

      - name: Sign app binaries via SignPath
        id: sign_apps
        uses: signpath/github-action-submit-signing-request@v2
        with:
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_UNSIGNED_ARTIFACT_CFG }}
          github-artifact-id: ${{ steps.upload_unsigned_apps.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed/apps

      - name: Build Inno Setup installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Copy-Item -Path "artifacts/signed/apps/Aiden.TrayMonitor.exe" -Destination "artifacts/stage/tray/Aiden.TrayMonitor.exe" -Force
          Copy-Item -Path "artifacts/signed/apps/Aiden.RuntimeAgent.exe" -Destination "artifacts/stage/agent/Aiden.RuntimeAgent.exe" -Force
          $source = "${{ github.workspace }}\artifacts\stage\package"
          $output = "${{ github.workspace }}\artifacts\installer"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ env.VERSION }}" `
            "/DSourceDir=$source" `
            "/DOutputDir=$output" `
            ".github\installer\aiden.iss"

      - name: Upload unsigned installer for SignPath
        id: upload_unsigned_installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: artifacts/installer/Aiden-Setup-${{ steps.version.outputs.version }}-win-x64.exe

      - name: Sign installer via SignPath
        id: sign_installer
        uses: signpath/github-action-submit-signing-request@v2
        with:
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CFG }}
          github-artifact-id: ${{ steps.upload_unsigned_installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed/installer

      - name: Replace installer with signed output
        shell: pwsh
        run: |
          $signedInstaller = Get-ChildItem -Path "artifacts/signed/installer" -Filter "Aiden-Setup-*.exe" -Recurse | Select-Object -First 1
          if (-not $signedInstaller) {
            throw "Signed installer not found in artifacts/signed/installer"
          }
          Copy-Item -Path $signedInstaller.FullName -Destination "artifacts/installer/Aiden-Setup-${{ steps.version.outputs.version }}-win-x64.exe" -Force

      - name: Verify signatures
        shell: pwsh
        run: |
          $files = @(
            "artifacts/stage/tray/Aiden.TrayMonitor.exe",
            "artifacts/stage/agent/Aiden.RuntimeAgent.exe",
            "artifacts/installer/Aiden-Setup-${{ steps.version.outputs.version }}-win-x64.exe"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "Missing file for signature verification: $file"
            }

            $sig = Get-AuthenticodeSignature -FilePath $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature on $file. Status=$($sig.Status)"
            }
          }

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $installer = "artifacts/installer/Aiden-Setup-${{ steps.version.outputs.version }}-win-x64.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer not found: $installer"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $installer)" | Out-File -FilePath "artifacts/installer/SHA256SUMS.txt" -Encoding ascii

      - name: Upload installer asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: artifacts/installer/Aiden-Setup-${{ steps.version.outputs.version }}-win-x64.exe
          asset_name: Aiden-Setup-${{ steps.version.outputs.version }}-win-x64.exe
          asset_content_type: application/octet-stream

      - name: Upload SHA256SUMS asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: artifacts/installer/SHA256SUMS.txt
          asset_name: SHA256SUMS.txt
          asset_content_type: text/plain
