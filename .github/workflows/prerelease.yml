name: Create Pre-release

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: "Base version in vMAJOR.MINOR.PATCH format (example: v0.1.0)"
        required: true
        type: string
      channel:
        description: "Pre-release channel"
        required: true
        type: choice
        default: alpha
        options:
          - alpha
          - beta
          - rc

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: prerelease-${{ inputs.channel }}-${{ inputs.base_version }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 8.0.x
  RID: win-x64

jobs:
  create-prerelease:
    runs-on: ubuntu-latest
    outputs:
      computed_tag: ${{ steps.next_tag.outputs.computed_tag }}
      release_upload_url: ${{ steps.create_release.outputs.release_upload_url }}
      release_url: ${{ steps.create_release.outputs.release_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next prerelease tag
        id: next_tag
        shell: pwsh
        run: |
          $baseVersion = '${{ inputs.base_version }}'
          $channel = '${{ inputs.channel }}'

          if ($baseVersion -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid base_version '$baseVersion'. Expected format: vMAJOR.MINOR.PATCH (example: v0.1.0)."
          }

          git fetch --tags --force origin

          $escapedBase = [regex]::Escape($baseVersion)
          $pattern = "^$escapedBase-$channel\.(\d+)$"
          $max = 0

          $matchingTags = git tag --list "$baseVersion-$channel.*"
          foreach ($tag in $matchingTags) {
            if ($tag -match $pattern) {
              $number = [int]$Matches[1]
              if ($number -gt $max) {
                $max = $number
              }
            }
          }

          $next = $max + 1
          $nextTag = "$baseVersion-$channel.$next"

          $existing = git tag --list $nextTag
          if (-not [string]::IsNullOrWhiteSpace($existing)) {
            throw "Tag '$nextTag' already exists. Re-run workflow to compute a new sequence."
          }

          "computed_tag=$nextTag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub pre-release
        id: create_release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.next_tag.outputs.computed_tag }}';
            const target = 'main';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });
              core.setFailed(`Tag '${tag}' already exists.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: target,
              name: tag,
              prerelease: true,
              draft: false,
              make_latest: 'false',
              generate_release_notes: true,
            });

            core.setOutput('release_upload_url', release.data.upload_url);
            core.setOutput('release_url', release.data.html_url);
            core.info(`Created pre-release: ${release.data.html_url}`);

      - name: Summary
        shell: bash
        run: |
          echo "Computed tag: ${{ steps.next_tag.outputs.computed_tag }}"
          echo "Pre-release URL: ${{ steps.create_release.outputs.release_url }}"

  build-prerelease-assets:
    needs: create-prerelease
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Determine release version
        id: version
        shell: pwsh
        run: .github/scripts/resolve-version-from-tag.ps1 -Tag '${{ needs.create-prerelease.outputs.computed_tag }}'

      - name: Build and stage release payload
        shell: pwsh
        run: .github/scripts/build-and-stage-release.ps1 -Version '${{ steps.version.outputs.version }}' -Rid '${{ env.RID }}'

      - name: Check SignPath readiness
        shell: pwsh
        env:
          SIGNPATH_READY: ${{ vars.SIGNPATH_READY }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_UNSIGNED_ARTIFACT_CFG: ${{ vars.SIGNPATH_UNSIGNED_ARTIFACT_CFG }}
          SIGNPATH_INSTALLER_ARTIFACT_CFG: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CFG }}
        run: .github/scripts/check-signpath-readiness.ps1

      - name: Upload unsigned app binaries for SignPath
        id: upload_unsigned_apps
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-binaries-${{ needs.create-prerelease.outputs.computed_tag }}
          path: |
            artifacts/stage/tray/Aiden.TrayMonitor.exe
            artifacts/stage/agent/Aiden.RuntimeAgent.exe

      - name: Sign app binaries via SignPath
        id: sign_apps
        uses: signpath/github-action-submit-signing-request@v2
        with:
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_UNSIGNED_ARTIFACT_CFG }}
          github-artifact-id: ${{ steps.upload_unsigned_apps.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed/apps

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          Copy-Item -Path "artifacts/signed/apps/Aiden.TrayMonitor.exe" -Destination "artifacts/stage/tray/Aiden.TrayMonitor.exe" -Force
          Copy-Item -Path "artifacts/signed/apps/Aiden.RuntimeAgent.exe" -Destination "artifacts/stage/agent/Aiden.RuntimeAgent.exe" -Force
          .github/scripts/build-inno-setup.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Upload unsigned installer for SignPath
        id: upload_unsigned_installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-${{ needs.create-prerelease.outputs.computed_tag }}
          path: artifacts/installer/Aiden-Setup-${{ steps.version.outputs.version }}-win-x64.exe

      - name: Sign installer via SignPath
        id: sign_installer
        uses: signpath/github-action-submit-signing-request@v2
        with:
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CFG }}
          github-artifact-id: ${{ steps.upload_unsigned_installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed/installer

      - name: Replace installer with signed output
        shell: pwsh
        run: .github/scripts/replace-signed-artifacts.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Verify signatures
        shell: pwsh
        run: .github/scripts/verify-signatures.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Generate SHA256SUMS
        shell: pwsh
        run: .github/scripts/generate-sha256sums.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Upload prerelease assets
        shell: pwsh
        run: .github/scripts/upload-release-assets.ps1 -UploadUrl '${{ needs.create-prerelease.outputs.release_upload_url }}' -Version '${{ steps.version.outputs.version }}' -GitHubToken '${{ secrets.GITHUB_TOKEN }}'
