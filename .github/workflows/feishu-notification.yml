name: Feishu Notification

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: feishu-notify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Notify Feishu
        uses: zhangyu528/sns-notification@main
        with:
          feishu_webhook: ${{ secrets.FEISHU_WEBHOOK }}
