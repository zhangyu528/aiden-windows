name: PR Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: tests-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore Aiden.sln

      - name: Run tests (PR Scope)
        shell: pwsh
        run: .\tests\Invoke-TestGate.ps1 -Scope PR

      - name: Publish .NET test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: PR .NET Tests
          path: artifacts/test-results/dotnet/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false
