name: PR Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: tests-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore Aiden.sln

      - name: Detect changed files
        id: changes
        shell: pwsh
        run: |
          $base = ''
          $head = ''

          if ('${{ github.event_name }}' -eq 'pull_request') {
            $base = '${{ github.event.pull_request.base.sha }}'
            $head = '${{ github.event.pull_request.head.sha }}'
          }
          else {
            $base = '${{ github.event.before }}'
            $head = '${{ github.sha }}'
          }

          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            $base = git rev-list --max-count=1 HEAD~1
          }
          if ([string]::IsNullOrWhiteSpace($head)) {
            $head = git rev-parse HEAD
          }

          Write-Host "Diff range: $base..$head"
          $files = @(git diff --name-only $base $head)
          $marker = [Guid]::NewGuid().ToString('N')
          "files<<$marker" >> $env:GITHUB_OUTPUT
          ($files -join "`n") >> $env:GITHUB_OUTPUT
          $marker >> $env:GITHUB_OUTPUT

      - name: Run tests (PR Scope)
        shell: pwsh
        run: |
          .\tests\Invoke-TestGate.ps1 -Scope PR -ChangedFilesText @'
          ${{ steps.changes.outputs.files }}
          '@

      - name: Publish .NET test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: PR .NET Tests
          path: artifacts/test-results/dotnet/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false
