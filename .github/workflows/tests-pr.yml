name: PR Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: tests-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore Aiden.sln

      - name: Run tests (PR Scope)
        shell: pwsh
        run: .\automation\tests\Invoke-TestGate.ps1 -Scope PR -InstallPester

      - name: Publish .NET test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: PR .NET Tests
          path: artifacts/test-results/dotnet/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload script test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-test-results
          path: artifacts/test-results/scripts/pester-workflow.xml
          if-no-files-found: ignore

      - name: Summarize script tests
        if: always()
        shell: pwsh
        run: |
          $reportPath = "artifacts/test-results/scripts/pester-workflow.xml"
          if (-not (Test-Path $reportPath)) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Script Tests`nNo Pester report file found at \`$reportPath\`."
            exit 0
          }

          [xml]$report = Get-Content $reportPath -Raw
          $root = $report.'test-results'
          $total = [int]$root.total
          $passed = $total - [int]$root.failures - [int]$root.errors - [int]$root.skipped - [int]$root.'not-run' - [int]$root.inconclusive
          $failed = [int]$root.failures + [int]$root.errors
          $skipped = [int]$root.skipped + [int]$root.'not-run' + [int]$root.inconclusive

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Script Tests"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Total | Passed | Failed | Skipped |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "|---:|---:|---:|---:|"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| $total | $passed | $failed | $skipped |"
